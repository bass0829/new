<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">

<style>

:root{

--cyan:#00E5FF;
--purple:#B400FF;
--bg:#0A0F1A;
--bg2:#101626;
--line:#38F3FF;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;
font-family:Orbitron,sans-serif;
background:
radial-gradient(circle at top,#18253d 0%,#101626 45%,#090d15 100%);
height:100vh;

color:white;

}


/* ==========================
背景霧光
=========================== */

body::before{

content:"";

position:absolute;

width:700px;
height:700px;

background:radial-gradient(circle,var(--purple),transparent 70%);

filter:blur(120px);

left:-180px;
top:-180px;

opacity:.25;

animation:float1 10s infinite alternate;

}

body::after{

content:"";

position:absolute;

width:650px;
height:650px;

background:radial-gradient(circle,var(--cyan),transparent 70%);

right:-200px;
bottom:-200px;

filter:blur(120px);

opacity:.22;

animation:float2 12s infinite alternate;

}

@keyframes float1{

to{
transform:translate(100px,60px);
}

}

@keyframes float2{

to{
transform:translate(-80px,-80px);
}

}


/* ==========================
Grid
=========================== */

.grid{

position:absolute;

inset:0;

background-image:

linear-gradient(rgba(56,243,255,.06) 1px,transparent 1px),

linear-gradient(90deg,rgba(56,243,255,.06) 1px,transparent 1px);

background-size:45px 45px;

}


/* ==========================
掃描線
=========================== */

.scan{

position:absolute;

width:100%;

height:100%;

pointer-events:none;

background:linear-gradient(

transparent 0%,

rgba(255,255,255,.05) 50%,

transparent 100%

);

background-size:100% 8px;

opacity:.3;

animation:scan 8s linear infinite;

}

@keyframes scan{

from{
transform:translateY(-100%);
}

to{
transform:translateY(100%);
}

}



/* ==========================
Container
=========================== */

.container{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

width:min(920px,92vw);

padding:80px;

border-radius:35px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border:1px solid rgba(56,243,255,.25);

box-shadow:

0 0 25px rgba(0,229,255,.15),

0 0 80px rgba(180,0,255,.15),

inset 0 0 35px rgba(255,255,255,.05);

overflow:hidden;

}


/* HUD */

.container::before{

content:"";

position:absolute;

inset:10px;

border:1px solid rgba(56,243,255,.25);

border-radius:24px;

pointer-events:none;

}

.container::after{

content:"SYSTEM ONLINE";

position:absolute;

top:18px;

right:25px;

font-size:12px;

color:var(--cyan);

letter-spacing:3px;

}


/* ==========================
角落裝飾
=========================== */

.corner{

position:absolute;

width:50px;

height:50px;

border:2px solid var(--line);

}

.tl{

top:18px;

left:18px;

border-right:none;

border-bottom:none;

}

.tr{

top:18px;

right:18px;

border-left:none;

border-bottom:none;

}

.bl{

bottom:18px;

left:18px;

border-right:none;

border-top:none;

}

.br{

bottom:18px;

right:18px;

border-left:none;

border-top:none;

}


/* ==========================
標題
=========================== */

h1{

font-size:clamp(52px,8vw,110px);

font-weight:800;

letter-spacing:8px;

color:white;

text-shadow:

0 0 10px var(--cyan),

0 0 30px var(--cyan),

0 0 60px var(--purple);

}

.subtitle{

margin-top:25px;

font-family:"Noto Sans TC";

font-size:18px;

opacity:.8;

letter-spacing:4px;

color:#b8d9ff;

}


/* ==========================
Loading
=========================== */

.loading{

margin-top:50px;

height:5px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

}

.bar{

height:100%;

width:0%;

background:linear-gradient(

90deg,

var(--cyan),

var(--purple)

);

box-shadow:

0 0 15px var(--cyan),

0 0 25px var(--purple);

animation:load 4s infinite;

}

@keyframes load{

0%{width:0%;}

50%{width:70%;}

100%{width:100%;}

}


/* ==========================
資訊
=========================== */

.info{

display:flex;

justify-content:space-between;

margin-top:45px;

font-size:13px;

letter-spacing:2px;

opacity:.7;

color:var(--cyan);

}


/* ==========================
粒子
=========================== */

canvas{

position:absolute;

inset:0;

}


/* ==========================
Mouse Light
=========================== */

.light{

position:absolute;

width:300px;

height:300px;

background:radial-gradient(circle,

rgba(56,243,255,.18),

transparent 70%);

pointer-events:none;

transform:translate(-50%,-50%);

mix-blend-mode:screen;

filter:blur(15px);

}


/* ==========================
RWD
=========================== */

@media(max-width:768px){

.container{

padding:45px;

}

.info{

flex-direction:column;

gap:10px;

}

}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="grid"></div>

<div class="scan"></div>

<div class="light" id="light"></div>

<div class="container">

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<h1 id="title"></h1>

<div class="subtitle">
SYSTEM INITIALIZING...
</div>

<div class="loading">
<div class="bar"></div>
</div>

<div class="info">

<div>STATUS // ONLINE</div>

<div>CYBER INTERFACE v3.2</div>

<div>POWER 99%</div>

</div>

</div>

<script>

/*==============================
Coming Soon 打字
==============================*/

const text="COMING SOON!";

let i=0;

function type(){

if(i<text.length){

document.getElementById("title").innerHTML+=text.charAt(i);

i++;

setTimeout(type,120);

}

}

type();



/*==============================
滑鼠光影
==============================*/

const light=document.getElementById("light");

window.addEventListener("mousemove",e=>{

light.style.left=e.clientX+"px";

light.style.top=e.clientY+"px";

});



/*==============================
粒子
==============================*/

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

resize();

window.addEventListener("resize",resize);

function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

}

const particles=[];

for(let i=0;i<120;i++){

particles.push({

x:Math.random()*innerWidth,

y:Math.random()*innerHeight,

r:Math.random()*2+1,

dx:(Math.random()-.5)*0.4,

dy:(Math.random()-.5)*0.4

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x+=p.dx;

p.y+=p.dy;

if(p.x<0)p.x=canvas.width;

if(p.x>canvas.width)p.x=0;

if(p.y<0)p.y=canvas.height;

if(p.y>canvas.height)p.y=0;

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fillStyle="rgba(0,229,255,.7)";

ctx.fill();

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
